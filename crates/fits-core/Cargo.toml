[package]
name = "fits-core"
version = "0.1.0"
edition = "2024"

# Bevy-free so the server and the browser's worker can share it: only Bevy's task pools.
[dependencies]
bytemuck = "1"
bevy_tasks = { version = "0.20", features = ["multi_threaded"] }
# For GZIP tiles of .fits.fz, and already in the tree through png.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
prost = "0.14"
zfp-rs = "1.0.1"

# The remote adapter's socket natively; the browser's worker has its own.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = "0.29"

# protox in place of protoc, so that nothing needs it installed.
[build-dependencies]
prost-build = { version = "0.14", default-features = false }
protox = "0.10"
