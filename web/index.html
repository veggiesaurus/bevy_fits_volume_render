<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FITS Volume Renderer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: oklch(0.2421 0.0129 258.3719); }
  canvas { outline: none; }
  #overlay {
    position: fixed; left: 0.75rem; bottom: 0.75rem; max-width: calc(100% - 1.5rem); box-sizing: border-box;
    display: flex; flex-direction: column; gap: 0.5rem; padding: 0.75rem;
    background: oklch(0.2795 0.0368 260.031 / 0.9); color: oklch(0.9288 0.0126 255.5078);
    border: 1px solid oklch(0.4461 0.0263 256.8018); border-radius: 0.5rem;
    font: 13px Inter, system-ui, sans-serif; overflow-wrap: anywhere;
  }
  #examples a { color: oklch(0.7137 0.1434 254.624); }
</style>
</head>
<body>
<canvas id="bevy"></canvas>
<div id="overlay">
  <input type="file" id="picker" aria-label="Open a FITS file" disabled>
  <nav id="examples" aria-label="Example cubes">
    <div>HI: <a href="?file=static.veggiesaurus.net/cubes/NGC4631-HR-cube.fits">NGC 4631</a> (600&nbsp;MB),
      <a href="?file=static.veggiesaurus.net/cubes/NGC5055-HR-cube.fits">NGC 5055</a> (709&nbsp;MB),
      <a href="?file=static.veggiesaurus.net/cubes/NGC_5236_NA_CUBE_THINGS.fits&amp;threshold_min=0.79&amp;threshold_max=0.87">M83</a> (544&nbsp;MB),
      <a href="?file=static.veggiesaurus.net/cubes/m33_hi_m55_to_m317kms.fits">M33</a> (1.1&nbsp;GB),
      <a href="?file=static.veggiesaurus.net/cubes/ic10_CDtp_hi21cm_0p8kms_30as.fits">IC 10</a> (1.3&nbsp;GB),
      <a href="?file=static.veggiesaurus.net/cubes/m25n512_hicube_gal15.fits">simulated galaxy</a> (88&nbsp;MB)</div>
    <div>CO: <a href="?file=static.veggiesaurus.net/cubes/ngc5236_12m7mtp_co21.fits">M83</a> (1.2&nbsp;GB),
      <a href="?file=static.veggiesaurus.net/cubes/HD163296_CO_2-1.fits">HD 163296</a> (187&nbsp;MB),
      <a href="?file=static.veggiesaurus.net/cubes/bin5_off2.fits">test cube</a> (64&nbsp;MB)</div>
    <div><a href="https://github.com/veggiesaurus/bevy_fits_volume_render#example-data">Data credits</a></div>
  </nav>
  <div id="status" role="status">Starting</div>
</div>
<script type="module">
import init, { clear, connect, opened, receive } from "./pkg/bevy_fits_volume_render.js";

const status = document.getElementById("status");
const picker = document.getElementById("picker");
const canvas = document.getElementById("bevy");
const params = new URLSearchParams(location.search);
// "host.example/path/cube.fits" with no scheme means https; anything else is relative to the page.
const file = params.get("file")?.replace(/^(?![a-z][a-z0-9+.-]*:|\/)([^/]+\.[^/]+\/)/i, "https://$1");
params.delete("file");
const hdu = params.get("hdu");
params.delete("hdu");
const overrides = [...params].map(([k, v]) => `${k}=${v}`).join("\n");
const mb = n => `${(n / 1e6).toFixed(1)} MB`;

// The file goes to a Web Worker, which reads it and serves the viewer's requests off this thread. After a failure
// its state can't be trusted, so the next load starts another.
let worker = startWorker();
function startWorker() {
  const w = new Worker("worker.js", { type: "module" });
  w.onmessage = ({ data }) => w === worker && fromWorker(data);
  // A module worker that doesn't load gets a plain Event, with no message.
  w.onerror = (e) => w === worker && failed(e.message || "worker.js did not load");
  return w;
}
function failed(message) {
  worker.terminate();
  worker = null;
  workerHolds(undefined);
  status.textContent = `The data worker failed: ${message}`;
}

// The load whose file is on screen. Once the worker no longer holds it nothing would answer the view, so it goes.
let shown;
function workerHolds(load) {
  if (shown !== undefined && load !== shown) {
    clear();
    shown = undefined;
  }
}

// Only the latest load may touch the status or the viewer, so a slow download can't replace a file picked
// after it started.
let latest = { id: 0 };

function load(name, source) {
  latest = { id: latest.id + 1, name };
  worker ??= startWorker();
  status.textContent = `Loading ${name}`;
  worker.postMessage({ load: latest.id, source, hdu });
}

function fromWorker(data) {
  if (data instanceof ArrayBuffer) return receive(data);
  if (data.failed) return failed(data.failed);
  if (data.load !== latest.id) return;
  const { name } = latest;
  if (data.got !== undefined) {
    status.textContent = `Downloading ${mb(data.got)}${data.total ? ` of ${mb(data.total)}` : ""}`;
  } else if (data.reading) {
    status.textContent = `Loading ${name}`;
  } else {
    try {
      if (data.error) throw new Error(data.error);
      opened(data.load, name, data.info, data.seconds, config, overrides);
      shown = data.load;
      canvas.focus();
      status.textContent = name;
    } catch (e) {
      // The worker may have dropped the file shown to read this one, or one that came between.
      workerHolds(data.error ? data.held : data.load);
      status.textContent = `Could not load ${name}: ${e.message ?? e}`;
    }
  }
}

function fileName(url) {
  const last = new URL(url, location.href).pathname.split("/").pop();
  try {
    return decodeURIComponent(last);
  } catch {
    return last;
  }
}

if (!navigator.gpu) {
  status.textContent = "This browser does not support WebGPU. Try a recent Chrome, Edge or Safari.";
  throw new Error("navigator.gpu is missing");
}

const config = await fetch("config.toml").then(r => (r.ok ? r.text() : ""), () => "");
try {
  await init();
} catch (e) {
  if (!e.message?.startsWith("Using exceptions for control flow")) {
    status.textContent = `Failed to start: ${e.message ?? e}`;
    throw e;
  }
}
// Without a worker this throws, which the viewer logs.
connect(message => worker.postMessage(message, [message]));

// Unless the worker failed while this started.
if (worker) status.textContent = "Open a FITS file";
picker.disabled = false;
// winit doesn't take focus on a drag, and keys (shift-drag, C, R, Esc) only reach the focused canvas.
canvas.addEventListener("pointerdown", () => canvas.focus());
picker.addEventListener("change", () => picker.files[0] && load(picker.files[0].name, picker.files[0]));
if (file) load(fileName(file), new URL(file, location.href).href);
</script>
</body>
</html>
