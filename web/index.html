<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FITS Volume Renderer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: oklch(0.2421 0.0129 258.3719); }
  canvas { outline: none; }
  #overlay {
    position: fixed; left: 0.75rem; bottom: 0.75rem; max-width: calc(100% - 1.5rem); box-sizing: border-box;
    display: flex; flex-direction: column; gap: 0.5rem; padding: 0.75rem;
    background: oklch(0.2795 0.0368 260.031 / 0.9); color: oklch(0.9288 0.0126 255.5078);
    border: 1px solid oklch(0.4461 0.0263 256.8018); border-radius: 0.5rem;
    font: 13px Inter, system-ui, sans-serif; overflow-wrap: anywhere;
  }
  #examples a { color: oklch(0.7137 0.1434 254.624); }
</style>
</head>
<body>
<canvas id="bevy"></canvas>
<div id="overlay">
  <input type="file" id="picker" aria-label="Open a FITS file" disabled>
  <nav id="examples" aria-label="Example cubes">
    <div>HI: <a href="?file=static.veggiesaurus.net/cubes/NGC4631-HR-cube.fits">NGC 4631</a> (600&nbsp;MB),
      <a href="?file=static.veggiesaurus.net/cubes/NGC5055-HR-cube.fits">NGC 5055</a> (709&nbsp;MB),
      <a href="?file=static.veggiesaurus.net/cubes/NGC_5236_NA_CUBE_THINGS.fits&amp;threshold_min=0.79&amp;threshold_max=0.87">M83</a> (544&nbsp;MB),
      <a href="?file=static.veggiesaurus.net/cubes/m33_hi_m55_to_m317kms.fits">M33</a> (1.1&nbsp;GB),
      <a href="?file=static.veggiesaurus.net/cubes/ic10_CDtp_hi21cm_0p8kms_30as.fits">IC 10</a> (1.3&nbsp;GB),
      <a href="?file=static.veggiesaurus.net/cubes/m25n512_hicube_gal15.fits">simulated galaxy</a> (88&nbsp;MB)</div>
    <div>CO: <a href="?file=static.veggiesaurus.net/cubes/ngc5236_12m7mtp_co21.fits">M83</a> (1.2&nbsp;GB),
      <a href="?file=static.veggiesaurus.net/cubes/HD163296_CO_2-1.fits">HD 163296</a> (187&nbsp;MB),
      <a href="?file=static.veggiesaurus.net/cubes/bin5_off2.fits">test cube</a> (64&nbsp;MB)</div>
    <div><a href="https://github.com/veggiesaurus/bevy_fits_volume_render#example-data">Data credits</a></div>
  </nav>
  <div id="status" role="status">Starting</div>
</div>
<script type="module">
import init, { load_fits } from "./pkg/bevy_fits_volume_render.js";

const status = document.getElementById("status");
const picker = document.getElementById("picker");
const canvas = document.getElementById("bevy");
const params = new URLSearchParams(location.search);
// "host.example/path/cube.fits" with no scheme means https; anything else is relative to the page.
const file = params.get("file")?.replace(/^(?![a-z][a-z0-9+.-]*:|\/)([^/]+\.[^/]+\/)/i, "https://$1");
params.delete("file");
const overrides = [...params].map(([k, v]) => `${k}=${v}`).join("\n");
const mb = n => `${(n / 1e6).toFixed(1)} MB`;

// Only the latest load may touch the status or the viewer, so a slow download can't replace a file picked
// after it started.
let latest;

const progress = (got, total) => (status.textContent = `Downloading ${mb(got)}${total ? ` of ${mb(total)}` : ""}`);

// A big file comes down as four ranges at once: in Chrome one stream only reached about half the line speed.
const PARTS = 4;
async function download(url, signal) {
  const head = await fetch(url, { method: "HEAD", signal }).catch(() => null);
  const total = head?.ok && !head.headers.get("Content-Encoding") ? Number(head.headers.get("Content-Length")) : 0;
  if (total >= PARTS << 23) {
    try {
      return await downloadRanges(url, total, signal);
    } catch (e) {
      if (signal.aborted) throw e;
    }
  }
  return downloadStream(url, signal);
}

// A BYOB read transfers the buffer it fills, so the ranges can't share one: each reads into its own scratch
// buffer and copies from it into the result.
async function downloadRanges(url, total, signal) {
  const abort = new AbortController();
  signal.addEventListener("abort", () => abort.abort(), { once: true });
  const bytes = new Uint8Array(total);
  const size = Math.ceil(total / PARTS);
  let got = 0;
  try {
    await Promise.all(Array.from({ length: PARTS }, async (_, i) => {
      const start = i * size, end = Math.min(total, start + size);
      const res = await fetch(url, { headers: { Range: `bytes=${start}-${end - 1}` }, signal: abort.signal });
      if (res.status !== 206) throw new Error(`no range support (${res.status})`);
      const reader = res.body.getReader({ mode: "byob" });
      let scratch = new ArrayBuffer(1 << 20);
      for (let at = start; at < end; ) {
        const { done, value } = await reader.read(new Uint8Array(scratch));
        if (done || at + value.length > end) throw new Error("range doesn't match its request");
        bytes.set(value, at);
        at += value.length;
        got += value.length;
        scratch = value.buffer;
        progress(got, total);
      }
    }));
  } catch (e) {
    abort.abort();
    throw e;
  }
  return bytes;
}

// Reads into one buffer sized from Content-Length, so the file is held once rather than as chunks plus a copy.
async function downloadStream(url, signal) {
  const res = await fetch(url, { signal });
  if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
  // With a Content-Encoding it's the compressed size, so the buffer grows instead.
  const total = res.headers.get("Content-Encoding") ? 0 : Number(res.headers.get("Content-Length"));
  let got = 0;
  // A BYOB reader fills the buffer in place, where the default reader hands back a new array per chunk that
  // piles up as garbage until the load is over.
  let byob = null;
  try {
    if (total) byob = res.body.getReader({ mode: "byob" });
  } catch {}
  if (byob) {
    let buffer = new ArrayBuffer(total);
    while (got < total) {
      const { done, value } = await byob.read(new Uint8Array(buffer, got));
      if (done) break;
      // Each read transfers the buffer, so carry on with the one it hands back.
      buffer = value.buffer;
      got += value.length;
      progress(got, total);
    }
    return new Uint8Array(buffer, 0, got);
  }
  const reader = res.body.getReader();
  let bytes = new Uint8Array(total || 1 << 20);
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    if (got + value.length > bytes.length) {
      const grown = new Uint8Array(Math.max(2 * bytes.length, got + value.length));
      grown.set(bytes.subarray(0, got));
      bytes = grown;
    }
    bytes.set(value, got);
    got += value.length;
    progress(got, total);
  }
  return bytes.subarray(0, got);
}

async function load(name, getBytes) {
  latest?.abort();
  const current = (latest = new AbortController());
  try {
    const bytes = await getBytes(current.signal);
    if (current.signal.aborted) return;
    status.textContent = `Loading ${name}`;
    load_fits(name, bytes, config, overrides);
    canvas.focus();
    status.textContent = name;
  } catch (e) {
    if (!current.signal.aborted) status.textContent = `Could not load ${name}: ${e.message ?? e}`;
  }
}

function fileName(url) {
  const last = new URL(url, location.href).pathname.split("/").pop();
  try {
    return decodeURIComponent(last);
  } catch {
    return last;
  }
}

if (!navigator.gpu) {
  status.textContent = "This browser does not support WebGPU. Try a recent Chrome, Edge or Safari.";
  throw new Error("navigator.gpu is missing");
}

const config = await fetch("config.toml").then(r => (r.ok ? r.text() : ""), () => "");
try {
  await init();
} catch (e) {
  if (!e.message?.startsWith("Using exceptions for control flow")) {
    status.textContent = `Failed to start: ${e.message ?? e}`;
    throw e;
  }
}

status.textContent = "Open a FITS file";
picker.disabled = false;
// winit doesn't take focus on a drag, and keys (shift-drag, C, R, Esc) only reach the focused canvas.
canvas.addEventListener("pointerdown", () => canvas.focus());
picker.addEventListener("change", () => picker.files[0] && load(picker.files[0].name, () => picker.files[0].bytes()));
if (file) load(fileName(file), signal => download(file, signal));
</script>
</body>
</html>
