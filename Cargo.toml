[package]
name = "bevy_fits_volume_render"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/fits-core", "crates/fits-worker"]
default-members = [".", "crates/fits-core"]
# Agents' git worktrees, so that cargo doesn't take them for members of this one.
exclude = [".claude"]

[dependencies]
# No audio, glTF, scenes, UI, picking or text: egui draws the panel and labels.
bevy = { version = "0.20", default-features = false, features = [
    "default_app",
    "std",
    "multi_threaded",
    "bevy_winit",
    "x11",
    "wayland",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "png",
] }
bytemuck = "1"
fits-core = { path = "crates/fits-core" }
bevy_egui = { version = "0.43", default-features = false, features = ["render", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
starlink-ast = "0.1"
toml = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.20", default-features = false, features = ["webgpu"] }
js-sys = "0.3"
wasm-bindgen = "0.2"

[lints.clippy]
# Bevy systems take their resources and queries as arguments, as Bevy's own crates allow.
too_many_arguments = "allow"

# Thin LTO for a native build to ship; `--release` stays quick to rebuild, and build-web.sh uses it.
[profile.dist]
inherits = "release"
lto = "thin"
