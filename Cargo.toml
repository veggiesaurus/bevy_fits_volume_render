[package]
name = "bevy_fits_volume_render"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.20"
bevy_egui = "0.43"
serde = { version = "1", features = ["derive"] }
starlink-ast = "0.1"
toml = "0.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.20", features = ["webgpu"] }
wasm-bindgen = "0.2"

[lints.clippy]
# Bevy systems take their resources and queries as arguments, as Bevy's own crates allow.
too_many_arguments = "allow"
